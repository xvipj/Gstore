<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} · Gorras Admin</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body data-page="{{.Page}}">
    <header class="site-header admin-header">
        <div class="container-wide header-inner">
            <a class="brand" href="/admin">GORRAS / ADMIN</a>
            <nav class="site-nav admin-nav" aria-label="Navegación de administración">
                <a class="nav-link" href="/admin">{{template "icon-grid"}}<span>Panel</span></a>
                <a class="nav-link" href="/admin/caps/new">{{template "icon-plus"}}<span>Nueva gorra</span></a>
                <a class="nav-link" href="/" target="_blank" rel="noopener">{{template "icon-external"}}<span>Ver tienda</span></a>
                <form class="inline-form" method="post" action="/admin/logout">
                    <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
                    <button class="button-link nav-link" type="submit">{{template "icon-logout"}}<span>Salir ({{.AdminUsername}})</span></button>
                </form>
            </nav>
        </div>
    </header>

    <main class="container-wide main">
        {{template "content" .}}
    </main>

    <footer class="site-footer">
        <div class="container-wide">
            <p>Gorras · Administración · {{.Year}}</p>
        </div>
    </footer>
</body>
</html>
