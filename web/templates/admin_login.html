{{define "content"}}
<div class="login-panel">
    <h1>Administración</h1>
    <p class="muted">Acceso exclusivo para administradores.</p>

    {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}

    <form class="stack-form" method="post" action="/admin/login">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label>
            Usuario
            <input type="text" name="username" value="{{.Username}}" autocomplete="username" required autofocus>
        </label>
        <label>
            Contraseña
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button button-primary" type="submit">Ingresar</button>
    </form>

    <p class="login-back"><a href="/">Volver a la tienda</a></p>
</div>
{{end}}
