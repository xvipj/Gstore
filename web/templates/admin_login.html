{{define "content"}}
<div class="login-panel">
    <h1>Administración</h1>
    <p class="muted">Acceso exclusivo para administradores.</p>

    {{if .Error}}<p class="form-error">{{.Error}}</p>{{end}}

    <form class="stack-form" method="post" action="/admin/login">
        <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
        <label>
            Usuario
            <input type="text" name="username" value="{{.Username}}" autocomplete="username" required autofocus>
        </label>
        <label>
            Contraseña
            <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button class="button button-primary" type="submit">{{template "icon-login"}}<span>Ingresar</span></button>
    </form>

    <p class="login-back"><a class="nav-link" href="/">{{template "icon-arrow-left"}}<span>Volver a la tienda</span></a></p>
</div>
{{end}}
