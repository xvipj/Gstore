<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{.Title}} · Gorras</title>
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body data-page="{{.Page}}">
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="/">GORRAS</a>
            <nav class="site-nav" aria-label="Navegación principal">
                <a class="nav-link" href="/carrito">{{template "icon-cart"}}<span>Carrito</span></a>
            </nav>
        </div>
    </header>

    <main class="container main">
        {{template "content" .}}
    </main>

    <footer class="site-footer">
        <div class="container">
            <p>Gorras · Tienda de demostración · {{.Year}}</p>
        </div>
    </footer>
</body>
</html>
